<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic LED Control - p5js-simple</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #eee;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #333;
        }
        
        h1 {
            font-size: 2em;
            color: #0ea5e9;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #888;
            font-size: 0.9em;
        }
        
        .main-content {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 30px;
            margin-bottom: 30px;
        }
        
        .control-panel {
            background: #16213e;
            border-radius: 10px;
            padding: 20px;
        }
        
        .settings-panel {
            background: #16213e;
            border-radius: 10px;
            padding: 20px;
        }
        
        .status-box {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 15px;
            background: #0f3460;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .status-indicator {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #ea580c;
        }
        
        .status-indicator.connected {
            background: #10b981;
            box-shadow: 0 0 10px #10b981;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .control-group {
            margin-bottom: 20px;
        }
        
        .control-group h3 {
            margin-bottom: 10px;
            color: #0ea5e9;
            font-size: 1.1em;
        }
        
        .control-group label {
            display: block;
            margin-bottom: 5px;
            color: #aaa;
            font-size: 0.9em;
        }
        
        .control-group input[type="range"] {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: #333;
            outline: none;
            -webkit-appearance: none;
        }
        
        .control-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #0ea5e9;
            cursor: pointer;
        }
        
        .button-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }
        
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            background: #374151;
            color: #fff;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9em;
        }
        
        button:hover {
            background: #4b5563;
            transform: translateY(-2px);
        }
        
        button.active {
            background: #0ea5e9;
            box-shadow: 0 0 10px #0ea5e9;
        }
        
        button:disabled {
            background: #666;
            cursor: not-allowed;
            opacity: 0.5;
        }
        
        .value-display {
            text-align: center;
            font-size: 1.2em;
            color: #0ea5e9;
            margin-top: 5px;
        }
        
        .log {
            background: #0f1419;
            border-radius: 8px;
            padding: 15px;
            max-height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.8em;
        }
        
        .log-entry {
            padding: 5px 0;
            border-bottom: 1px solid #333;
        }
        
        .log-entry.send {
            color: #10b981;
        }
        
        .log-entry.receive {
            color: #0ea5e9;
        }
        
        .log-entry.error {
            color: #ea580c;
        }
        
        #led-canvas {
            border-radius: 8px;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Basic LED Control</h1>
            <p class="subtitle">p5js-simple - Decoupled LED Development</p>
        </header>
        
        <div class="main-content">
            <div class="control-panel">
                <div class="status-box">
                    <span id="status-text">Disconnected</span>
                    <span id="status-indicator"></span>
                </div>
                
                <div id="led-canvas"></div>
            </div>
            
            <div class="settings-panel">
                <h3>Connection</h3>
                <div class="control-group">
                    <label for="host">Host:</label>
                    <input type="text" id="host" value="localhost" placeholder="localhost">
                </div>
                <div class="control-group">
                    <label for="port">Port:</label>
                    <input type="text" id="port" value="8080" placeholder="8080">
                </div>
                <div class="control-group">
                    <button onclick="connect()" id="connect-btn">Connect</button>
                    <button onclick="disconnect()" id="disconnect-btn" disabled>Disconnect</button>
                </div>
                
                <h3>LED Settings</h3>
                <div class="control-group">
                    <label for="num-leds">Number of LEDs:</label>
                    <input type="range" id="num-leds" min="10" max="500" value="240" oninput="updateNumLEDs()">
                    <div class="value-display" id="num-leds-value">240</div>
                </div>
                
                <div class="control-group">
                    <label for="brightness">Brightness:</label>
                    <input type="range" id="brightness" min="0" max="255" value="128" oninput="updateBrightness()">
                    <div class="value-display" id="brightness-value">128</div>
                </div>
                
                <h3>Modes</h3>
                <div class="button-grid">
                    <button onclick="setMode('off')" class="mode-btn" data-mode="off">Off</button>
                    <button onclick="setMode('solid')" class="mode-btn" data-mode="solid">Solid</button>
                    <button onclick="setMode('rainbow')" class="mode-btn" data-mode="rainbow">Rainbow</button>
                    <button onclick="setMode('fire')" class="mode-btn" data-mode="fire">Fire</button>
                </div>
                
                <h3>Color</h3>
                <div class="control-group">
                    <label for="color-picker">Color:</label>
                    <input type="color" id="color-picker" value="#ff0000" oninput="updateColor()">
                </div>
                
                <h3>Log</h3>
                <div class="log" id="log"></div>
                <button onclick="clearLog()" style="margin-top: 10px;">Clear Log</button>
            </div>
        </div>
    </div>
    
    <script>
        // Global state
        let socket;
        let isConnected = false;
        let ledColors = [];
        let currentMode = 'off';
        let currentColor = [255, 0, 0];
        let numLEDs = 240;
        let brightness = 128;
        
        // p5.js sketch
        let sketch = function(p) {
            p.setup = function() {
                const canvas = p.createCanvas(800, 200);
                canvas.parent('led-canvas');
                p.frameRate(30);
                
                // Initialize LED colors
                for (let i = 0; i < numLEDs; i++) {
                    ledColors.push(p.color(0, 0, 0));
                }
            };
            
            p.draw = function() {
                p.background(30, 30, 40);
                
                // Draw LED strip
                drawLEDStrip(p, ledColors);
                
                // Update LED colors based on mode
                updateLEDs();
            };
        };
        
        // Draw LED strip
        function drawLEDStrip(p, colors) {
            const ledWidth = p.width / numLEDs;
            const ledHeight = p.height * 0.8;
            const startY = (p.height - ledHeight) / 2;
            
            for (let i = 0; i < colors.length; i++) {
                const x = i * ledWidth;
                const y = startY;
                
                p.fill(colors[i]);
                p.noStroke();
                p.rect(x, y, ledWidth - 1, ledHeight);
            }
        }
        
        // Update LED colors based on current mode
        function updateLEDs() {
            switch (currentMode) {
                case 'off':
                    for (let i = 0; i < ledColors.length; i++) {
                        ledColors[i] = color(0, 0, 0);
                    }
                    break;
                    
                case 'solid':
                    for (let i = 0; i < ledColors.length; i++) {
                        ledColors[i] = color(currentColor[0], currentColor[1], currentColor[2]);
                    }
                    break;
                    
                case 'rainbow':
                    for (let i = 0; i < ledColors.length; i++) {
                        const hue = p.map(i + p.frameCount * 2, 0, ledColors.length, 0, 255);
                        ledColors[i] = p.color(p.HSBtoRGB(hue / 255, 1, 1));
                    }
                    break;
                    
                case 'fire':
                    // Simple fire simulation
                    for (let i = 0; i < ledColors.length; i++) {
                        const intensity = p.map(i, 0, ledColors.length, 0, 1);
                        const r = 255 * intensity;
                        const g = 50 * intensity;
                        const b = 0;
                        ledColors[i] = p.color(r, g, b);
                    }
                    break;
            }
            
            // Send to server if connected
            if (isConnected && socket.readyState === WebSocket.OPEN) {
                sendPixelData();
            }
        }
        
        // Connect to WebSocket server
        function connect() {
            const host = document.getElementById('host').value;
            const port = document.getElementById('port').value;
            
            addLog('Connecting to ws://' + host + ':' + port + '...', 'send');
            
            socket = new WebSocket('ws://' + host + ':' + port);
            
            socket.onopen = () => {
                isConnected = true;
                updateStatus(true);
                addLog('Connected!', 'receive');
                
                // Identify ourselves
                socket.send(JSON.stringify({
                    type: 'identify',
                    client: 'p5js-basic-control',
                    version: '1.0'
                }));
                
                // Send initial state
                sendMode();
                sendColor();
                sendBrightness();
            };
            
            socket.onmessage = (event) => {
                const data = JSON.parse(event.data);
                addLog('Received: ' + JSON.stringify(data).substring(0, 50) + '...', 'receive');
                
                handleMessage(data);
            };
            
            socket.onclose = () => {
                isConnected = false;
                updateStatus(false);
                addLog('Disconnected', 'error');
            };
            
            socket.onerror = (err) => {
                addLog('Error: ' + err.message, 'error');
            };
            
            document.getElementById('connect-btn').disabled = true;
            document.getElementById('disconnect-btn').disabled = false;
        }
        
        // Disconnect
        function disconnect() {
            if (socket) {
                socket.close();
            }
            isConnected = false;
            updateStatus(false);
            document.getElementById('connect-btn').disabled = false;
            document.getElementById('disconnect-btn').disabled = true;
        }
        
        // Handle incoming messages
        function handleMessage(data) {
            switch (data.type) {
                case 'connected':
                    addLog('Server: ' + data.server + ' v' + data.version, 'receive');
                    break;
                    
                case 'pong':
                    // Response to ping
                    break;
                    
                case 'mode':
                    // Mode changed by another client
                    currentMode = data.mode;
                    updateModeButtons();
                    break;
                    
                case 'color':
                    // Color changed by another client
                    currentColor = data.color;
                    document.getElementById('color-picker').value = rgbToHex(currentColor);
                    break;
                    
                case 'brightness':
                    // Brightness changed by another client
                    brightness = data.value;
                    document.getElementById('brightness').value = brightness;
                    document.getElementById('brightness-value').textContent = brightness;
                    break;
                    
                case 'pixels':
                    // Pixel data from another client
                    // Update our LED colors
                    if (data.data && data.count) {
                        for (let i = 0; i < Math.min(data.count, ledColors.length); i++) {
                            ledColors[i] = color(
                                data.data[i*3],
                                data.data[i*3+1],
                                data.data[i*3+2]
                            );
                        }
                    }
                    break;
            }
        }
        
        // Update status display
        function updateStatus(connected) {
            const statusText = document.getElementById('status-text');
            const statusIndicator = document.getElementById('status-indicator');
            
            if (connected) {
                statusText.textContent = 'Connected';
                statusIndicator.classList.add('connected');
            } else {
                statusText.textContent = 'Disconnected';
                statusIndicator.classList.remove('connected');
            }
        }
        
        // Set mode
        function setMode(mode) {
            currentMode = mode;
            updateModeButtons();
            sendMode();
        }
        
        // Update mode buttons
        function updateModeButtons() {
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.mode === currentMode) {
                    btn.classList.add('active');
                }
            });
        }
        
        // Update color
        function updateColor() {
            const hex = document.getElementById('color-picker').value;
            currentColor = hexToRgb(hex);
            sendColor();
        }
        
        // Update number of LEDs
        function updateNumLEDs() {
            numLEDs = parseInt(document.getElementById('num-leds').value);
            document.getElementById('num-leds-value').textContent = numLEDs;
            
            // Resize LED array
            while (ledColors.length < numLEDs) {
                ledColors.push(color(0, 0, 0));
            }
            ledColors.length = numLEDs;
        }
        
        // Update brightness
        function updateBrightness() {
            brightness = parseInt(document.getElementById('brightness').value);
            document.getElementById('brightness-value').textContent = brightness;
            sendBrightness();
        }
        
        // Send mode to server
        function sendMode() {
            if (!isConnected) return;
            socket.send(JSON.stringify({
                type: 'mode',
                mode: currentMode
            }));
            addLog('Sent mode: ' + currentMode, 'send');
        }
        
        // Send color to server
        function sendColor() {
            if (!isConnected) return;
            socket.send(JSON.stringify({
                type: 'color',
                color: currentColor
            }));
            addLog('Sent color: [' + currentColor.join(', ') + ']', 'send');
        }
        
        // Send brightness to server
        function sendBrightness() {
            if (!isConnected) return;
            socket.send(JSON.stringify({
                type: 'brightness',
                value: brightness
            }));
            addLog('Sent brightness: ' + brightness, 'send');
        }
        
        // Send pixel data to server
        function sendPixelData() {
            const pixels = ledColors.map(c => {
                const r = p.red(c);
                const g = p.green(c);
                const b = p.blue(c);
                return [r, g, b];
            }).flat();
            
            socket.send(JSON.stringify({
                type: 'pixels',
                data: pixels,
                count: numLEDs
            }));
        }
        
        // Add log entry
        function addLog(message, type = 'send') {
            const log = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = 'log-entry ' + type;
            entry.textContent = new Date().toLocaleTimeString() + ' - ' + message;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
        }
        
        // Clear log
        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }
        
        // Helper: RGB to Hex
        function rgbToHex(rgb) {
            return '#' + rgb.map(x => {
                const hex = x.toString(16);
                return hex.length === 1 ? '0' + hex : hex;
            }).join('');
        }
        
        // Helper: Hex to RGB
        function hexToRgb(hex) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return [r, g, b];
        }
        
        // Helper: Create p5.js color
        function color(r, g, b) {
            return { r, g, b, toString: () => `rgb(${r},${g},${b})` };
        }
        
        // Initialize p5.js
        new p5(sketch);
    </script>
</body>
</html>
